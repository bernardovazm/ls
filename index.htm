<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LS</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 110 100%22><text y=%221.0em%22 font-size=%2290%22>💬</text></svg>"
    />
  </head>
  <body>
    <main>
      <h1 class="logo">LS</h1>
      <h2 class="id-container">
        Your ID: <span id="yourPeerId" class="editable-id" tabindex="0"></span>
      </h2>
      <label for="peerIdInput">Other user ID:</label>
      <input id="peerIdInput" placeholder="Peer ID" />
      <button id="addUserBtn">Add to list</button>
      <label>Status: </label>
      <input id="statusInput" placeholder="Type a status" />
      <label for="messageInput">Message:</label>
      <input id="messageInput" placeholder="Type a message" /><input
        type="checkbox"
        id="micCheckbox"
      />
      <label id="micLabel" for="micCheckbox">Microphone</label>
      <input type="checkbox" id="cameraCheckbox" />
      <label id="cameraLabel" for="cameraCheckbox">Camera</label>
      <div id="cameraOptions" hidden>
        <select id="cameraSelect">
          <option value="" disabled selected>Choose a device</option>
        </select>
      </div>
      <div id="localVideoContainer" hidden>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <input type="checkbox" id="screenCheckbox" />
      <label id="screenLabel" for="screenCheckbox">Screen</label>
      <div id="screenContainer" hidden>
        <video id="screenVideo" autoplay muted playsinline></video>
      </div>
      <input type="checkbox" id="aiCheckbox" />
      <label id="aiLabel" for="aiCheckbox">AI</label>
      <div id="translation">
        <input type="checkbox" id="translateCheckbox" />
        <label id="translateLabel" for="translateCheckbox"
          >Translate page</label
        >
      </div>
      <div id="loadingIndicator" hidden>
        <div id="spinner"></div>
        <span>Loading…</span>
      </div>
      <button id="sendButton">Send</button>
      <h2>User list:</h2>
      <ul id="userList">
        <li>No users added.</li>
      </ul>
      <h2>Received messages:</h2>
      <ul id="receivedMessages">
        <li>No messages yet.</li>
      </ul>
      <audio id="remoteAudio" autoplay></audio>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
