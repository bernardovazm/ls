<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LS</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 110 100%22><text y=%221.0em%22 font-size=%2290%22>💬</text></svg>"
    />
  </head>
  <body>
    <main>
      <h1 class="logo">LS</h1>

      <h2 id="yourPeerId">Your ID:</h2>

      <label>
        Other user ID:
        <input id="peerIdInput" placeholder="Peer ID" />
      </label>

      <label>
        Message:
        <input id="messageInput" placeholder="Type a message" />
      </label>

      <label><input type="checkbox" id="micCheckbox" /> Microphone</label>
      <label><input type="checkbox" id="aiCheckbox" /> AI</label>

      <div id="translation">
        <label>
          <input type="checkbox" id="translateCheckbox" />
          <span id="translateLabel">Translate page</span>
        </label>
      </div>

      <div id="loadingIndicator" hidden>
        <div id="spinner"></div>
        Loading…
      </div>

      <button id="sendButton">SEND</button>

      <h2>Received messages:</h2>
      <ul id="receivedMessages">
        <li>No messages yet.</li>
      </ul>

      <audio id="remoteAudio" autoplay></audio>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
